[project]
name = "boxedsi"
version = "0.1.0"
description = "Mask secrets and personal data before they reach AI models, restore the results locally."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "boxed.si authors" }]
keywords = ["secrets", "pii", "masking", "redaction", "privacy", "llm", "ai-agents", "claude-code", "codex", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Text Processing :: Filters",
]
dependencies = [
    "cryptography>=43",
    "keyring>=25",
    "mcp>=2.3",
]

[project.urls]
Homepage = "https://boxed.si"
Repository = "https://github.com/boxedsi/boxedsi"
Issues = "https://github.com/boxedsi/boxedsi/issues"
Changelog = "https://github.com/boxedsi/boxedsi/blob/main/CHANGELOG.md"

[project.scripts]
boxed = "boxed.cli:main"

[project.entry-points.pyinstaller40]
hook-dirs = "boxed._pyinstaller:get_hook_dirs"

[project.optional-dependencies]
ner-ru = [
    "natasha>=1.6.0",
]
ner-en = [
    "gliner>=0.2",
    "protobuf>=4",  # transformers reads the mdeberta sentencepiece tokenizer through protobuf
]
formats = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pypdf>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The source archive is listed: the folder also holds the desktop build (gigabytes), CI, the demo and its images.
# The extension files are those the wheel takes in below; tests/ reads bench/ and scripts/gen_cli_docs.py.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/bench",
    "/docs",
    "/plugin",
    "/.claude-plugin",
    "/extension/manifest.json",
    "/extension/background.js",
    "/extension/sidepanel.html",
    "/extension/sidepanel.js",
    "/extension/lib",
    "/extension/icons",
    "/extension/README.md",
    "/scripts/gen_cli_docs.py",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/AGENTS.md",
    "/CONTEXT.md",
    "/.python-version",
    "/uv.lock",
]
exclude = ["/docs/assets", "__pycache__", "*.pyc", ".DS_Store"]

[tool.hatch.build.targets.wheel]
packages = ["src/boxed"]

[tool.hatch.build.targets.wheel.force-include]
"plugin" = "boxed/_claude_plugin/plugin"
".claude-plugin/marketplace.json" = "boxed/_claude_plugin/.claude-plugin/marketplace.json"
"extension/manifest.json" = "boxed/_extension/manifest.json"
"extension/background.js" = "boxed/_extension/background.js"
"extension/sidepanel.html" = "boxed/_extension/sidepanel.html"
"extension/sidepanel.js" = "boxed/_extension/sidepanel.js"
"extension/lib/protocol.js" = "boxed/_extension/lib/protocol.js"
"extension/lib/observe.js" = "boxed/_extension/lib/observe.js"
"extension/icons/icon-16.png" = "boxed/_extension/icons/icon-16.png"
"extension/icons/icon-32.png" = "boxed/_extension/icons/icon-32.png"
"extension/icons/icon-48.png" = "boxed/_extension/icons/icon-48.png"
"extension/icons/icon-128.png" = "boxed/_extension/icons/icon-128.png"
"extension/icons/icon.svg" = "boxed/_extension/icons/icon.svg"
"extension/README.md" = "boxed/_extension/README.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["real_registry: the test uses the real registry of Windows, and runs only with BOXED_TEST_REAL_REGISTRY=1 (the others get a fake one)"]
