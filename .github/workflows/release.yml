name: Release

# Two runs. A tag v* runs the checks, builds the files and makes a draft GitHub release with them and their SHA256SUMS.
# Nothing goes to PyPI then. A person reads the draft and publishes it by hand: that "published" event starts the second
# run, which takes the same files from the release, checks them against SHA256SUMS and uploads them to PyPI.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # The checks of every push (ci.yml): no build without them.
  checks:
    name: CI checks
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build sdist and wheel
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: The tag matches the version in pyproject.toml
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in pyproject.toml" >&2
            exit 1
          fi
      - run: uv build --out-dir dist
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > ../SHA256SUMS && cat ../SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error

  github-release:
    name: GitHub release (draft)
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: out
      # A draft: the owner pastes the release text, checks the files and publishes it by hand.
      - name: Create the release with the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/dist/* out/SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --draft --verify-tag

  pypi:
    name: Publish to PyPI
    # Only after a person published the draft, and only while the repository variable PYPI_PUBLISH is true. It is off until
    # a PyPI project with a trusted publisher exists.
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/boxedsi/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Take the files of the release and check them
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir sums --pattern SHA256SUMS
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.whl' --pattern '*.tar.gz'
          # Exactly the files the build listed, each with its checksum: nothing added to the release later goes out.
          diff <(awk '{print $2}' sums/SHA256SUMS | sort) <(cd dist && printf '%s\n' * | sort)
          (cd dist && sha256sum --check --strict ../sums/SHA256SUMS)
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
