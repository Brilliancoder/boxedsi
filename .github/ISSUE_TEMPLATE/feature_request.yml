name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        boxed.si is alpha and maintained by a small team, so a clear problem statement helps more than a finished design.
        Do not paste real secrets or personal data. A new kind of value to detect: use the "Detector report" form.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How it could work. Commands or options as you imagine them are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: Workarounds, other tools or options you considered.
  - type: dropdown
    id: help
    attributes:
      label: Would you like to work on it?
      options:
        - "Yes"
        - Maybe, with guidance
        - "No"
    validations:
      required: true
