[package]
name = "boxed-desktop"
version = "0.1.0"
description = "Experimental desktop app of boxed.si: a Tauri window over the boxed serve sidecar"
authors = ["boxed.si authors"]
license = "Apache-2.0"
repository = "https://github.com/boxedsi/boxedsi"
homepage = "https://boxed.si"
edition = "2021"
publish = false
default-run = "boxed-desktop"

[lib]
name = "boxed_desktop_lib"

[[test]]
name = "manager"
harness = false # its fake sidecar is the test executable itself, and libtest would print into the frame stream

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-updater = "2.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# a sidecar runs in its own process group, which is ended as a whole (killpg), and a pid that may be a leftover is looked up
[target.'cfg(unix)'.dependencies]
libc = "0.2"
